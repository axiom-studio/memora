<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} — {{end}}Memora</title>
  <link rel="stylesheet" href="/ui/static/css/style.css">
  <script>
  (function(){
    var s = localStorage.getItem('memora-theme');
    if (s === 'light' || s === 'dark') document.documentElement.setAttribute('data-theme', s);
  })();
  </script>
  <script src="/ui/static/js/htmx.min.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand"><img src="/ui/static/images/memora-logo.svg" alt="Memora" class="sidebar-logo">memora</div>
      <ul class="sidebar-nav">
        <li><a href="/ui/" {{if eq .Nav "home"}}class="active"{{end}}>Dashboard</a></li>
        <li><a href="/ui/workspaces" {{if eq .Nav "workspaces"}}class="active"{{end}}>Workspaces</a></li>
        <li><a href="/ui/federation" {{if eq .Nav "federation"}}class="active"{{end}}>Federation</a></li>
        <li><a href="/ui/audit" {{if eq .Nav "audit"}}class="active"{{end}}>Audit</a></li>
        <li><a href="/ui/settings" {{if eq .Nav "settings"}}class="active"{{end}}>Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="search-trigger" onclick="document.getElementById('search-palette').showModal()" title="Search (Ctrl+K)">Search…</button>
        <div class="theme-toggle">
          <button id="theme-btn" onclick="window.__toggleTheme()" title="Toggle light/dark mode">
            <span id="theme-icon"></span> <span id="theme-label"></span>
          </button>
        </div>
        <span>memora v0.3</span>
      </div>
    </nav>
    <main class="main" role="main">
      {{template "content" .}}
    </main>
    <aside id="activity-rail" class="activity-rail collapsed">
      <button class="activity-rail-toggle" onclick="document.getElementById('activity-rail').classList.toggle('collapsed')" title="Toggle activity feed">Activity</button>
      <div class="activity-rail-body">
        <h4 style="margin:0 0 0.5rem;font-size:0.85rem">Live Activity</h4>
        <table>
          <thead><tr><th>Time</th><th>Op</th><th>Target</th><th>Agent</th></tr></thead>
          <tbody id="activity-entries"></tbody>
        </table>
      </div>
    </aside>
  </div>

  <dialog id="search-palette" class="search-palette">
    <form method="dialog" style="display:flex;flex-direction:column;height:100%">
      <input type="text" id="search-input" placeholder="Search workspaces, agents, memories…"
             hx-get="/ui/partials/search"
             hx-trigger="keyup changed delay:200ms"
             hx-target="#search-results"
             hx-swap="innerHTML"
             name="q"
             autocomplete="off"
             autofocus>
      <div id="search-results" style="flex:1;overflow:auto;padding:0.5rem">
        <p class="text-muted">Type to search workspaces, agents, and memories.</p>
      </div>
      <div style="text-align:right;padding:0.5rem 0 0;border-top:1px solid var(--border)">
        <button type="submit" class="btn btn-secondary" style="font-size:0.8rem">Close</button>
      </div>
    </form>
  </dialog>

  <script>
  (function(){
    function getEffective() {
      var s = localStorage.getItem('memora-theme');
      if (s === 'light' || s === 'dark') return s;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function updateUI() {
      var t = getEffective();
      var icon = document.getElementById('theme-icon');
      var label = document.getElementById('theme-label');
      if (icon) icon.textContent = t === 'dark' ? '☀️' : '🌙';
      if (label) label.textContent = t === 'dark' ? 'Light' : 'Dark';
    }
    window.__toggleTheme = function() {
      var cur = getEffective();
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('memora-theme', next);
      updateUI();
    };
    updateUI();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (!localStorage.getItem('memora-theme')) updateUI();
    });
  })();

  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      var d = document.getElementById('search-palette');
      if (d.open) { d.close(); } else { d.showModal(); document.getElementById('search-input').focus(); }
    }
    if (e.key === 'Escape') {
      var d = document.getElementById('search-palette');
      if (d.open) { d.close(); }
    }
  });
  document.getElementById('search-palette').addEventListener('click', function(e) {
    if (e.target === this) this.close();
  });

  (function() {
    var es = new EventSource('/ui/events/activity');
    var tbody = document.getElementById('activity-entries');
    es.addEventListener('activity', function(e) {
      tbody.insertAdjacentHTML('afterbegin', e.data);
      while (tbody.children.length > 50) tbody.removeChild(tbody.lastChild);
    });
  })();
  </script>
</body>
</html>
