<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} — {{end}}Memora</title>
  <link rel="stylesheet" href="/ui/static/css/style.css">
  <script>
  (function(){
    var s = localStorage.getItem('memora-theme');
    if (s === 'light' || s === 'dark') document.documentElement.setAttribute('data-theme', s);
  })();
  </script>
  <script src="/ui/static/js/htmx.min.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <img src="/ui/static/images/memora-logo.svg" alt="Memora" class="sidebar-logo">
        <span class="sidebar-brand-text">memora</span>
        <button class="sidebar-collapse-btn" onclick="window.__toggleSidebar()" title="Collapse sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.354 4.354a.5.5 0 0 0-.708-.708L6 8.293l4.646 4.647a.5.5 0 0 0 .708-.708L7.414 8.293l3.94-3.939z"/></svg>
        </button>
      </div>
      <ul class="sidebar-nav">
        <li><a href="/ui/" {{if eq .Nav "home"}}class="active"{{end}} title="Dashboard">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="nav-label">Dashboard</span></a></li>
        <li><a href="/ui/workspaces" {{if eq .Nav "workspaces"}}class="active"{{end}} title="Workspaces">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="nav-label">Workspaces</span></a></li>
        <li><a href="/ui/federation" {{if eq .Nav "federation"}}class="active"{{end}} title="Federation">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="nav-label">Federation</span></a></li>
        <li><a href="/ui/audit" {{if eq .Nav "audit"}}class="active"{{end}} title="Audit">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span class="nav-label">Audit</span></a></li>
        <li><a href="/ui/settings" {{if eq .Nav "settings"}}class="active"{{end}} title="Settings">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="nav-label">Settings</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="search-trigger" onclick="document.getElementById('search-palette').showModal()" title="Search (Ctrl+K)">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="nav-label">Search…</span>
        </button>
        <div class="theme-toggle">
          <button id="theme-btn" onclick="window.__toggleTheme()" title="Toggle light/dark mode">
            <span id="theme-icon"></span> <span id="theme-label" class="nav-label"></span>
          </button>
        </div>
        <span class="sidebar-version nav-label">memora v0.3</span>
      </div>
    </nav>
    <main class="main" role="main">
      {{template "content" .}}
    </main>
    <aside id="activity-rail" class="activity-rail collapsed">
      <button class="activity-rail-toggle" onclick="document.getElementById('activity-rail').classList.toggle('collapsed')" title="Toggle activity feed">Activity</button>
      <div class="activity-rail-body">
        <h4 style="margin:0 0 0.5rem;font-size:0.85rem">Live Activity</h4>
        <table>
          <thead><tr><th>Time</th><th>Op</th><th>Target</th><th>Agent</th></tr></thead>
          <tbody id="activity-entries"></tbody>
        </table>
      </div>
    </aside>
  </div>

  <dialog id="search-palette" class="search-palette">
    <form method="dialog" style="display:flex;flex-direction:column;height:100%">
      <input type="text" id="search-input" placeholder="Search workspaces, agents, memories…"
             hx-get="/ui/partials/search"
             hx-trigger="keyup changed delay:200ms"
             hx-target="#search-results"
             hx-swap="innerHTML"
             name="q"
             autocomplete="off"
             autofocus>
      <div id="search-results" style="flex:1;overflow:auto;padding:0.5rem">
        <p class="text-muted">Type to search workspaces, agents, and memories.</p>
      </div>
      <div style="text-align:right;padding:0.5rem 0 0;border-top:1px solid var(--border)">
        <button type="submit" class="btn btn-secondary" style="font-size:0.8rem">Close</button>
      </div>
    </form>
  </dialog>

  <script>
  (function(){
    function getEffective() {
      var s = localStorage.getItem('memora-theme');
      if (s === 'light' || s === 'dark') return s;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function updateUI() {
      var t = getEffective();
      var icon = document.getElementById('theme-icon');
      var label = document.getElementById('theme-label');
      if (icon) icon.textContent = t === 'dark' ? '☀️' : '🌙';
      if (label) label.textContent = t === 'dark' ? 'Light' : 'Dark';
    }
    window.__toggleSidebar = function() {
      var sb = document.getElementById('sidebar');
      var collapsed = sb.classList.toggle('collapsed');
      localStorage.setItem('memora-sidebar', collapsed ? 'collapsed' : 'expanded');
    };
    (function(){
      if (localStorage.getItem('memora-sidebar') === 'collapsed') {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    })();

    window.__toggleTheme = function() {
      var cur = getEffective();
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('memora-theme', next);
      updateUI();
    };
    updateUI();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (!localStorage.getItem('memora-theme')) updateUI();
    });
  })();

  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      var d = document.getElementById('search-palette');
      if (d.open) { d.close(); } else { d.showModal(); document.getElementById('search-input').focus(); }
    }
    if (e.key === 'Escape') {
      var d = document.getElementById('search-palette');
      if (d.open) { d.close(); }
    }
  });
  document.getElementById('search-palette').addEventListener('click', function(e) {
    if (e.target === this) this.close();
  });

  (function() {
    var es = new EventSource('/ui/events/activity');
    var tbody = document.getElementById('activity-entries');
    es.addEventListener('activity', function(e) {
      tbody.insertAdjacentHTML('afterbegin', e.data);
      while (tbody.children.length > 50) tbody.removeChild(tbody.lastChild);
    });
  })();
  </script>
</body>
</html>
