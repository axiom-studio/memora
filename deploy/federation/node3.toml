[server]
addr = ":7777"
mode = "single-tenant"
# api_key comes from MEMORA_API_KEY (set per node in docker-compose.yml).

[storage]
data_dir = "/data"
metadata_driver = "sqlite"
vector_driver = "sqlite-vec"
ledger_driver = "sqlite"
graph_driver = "sqlite_graph"
content_driver = "file"

[embedding]
model = "hash:default"  # offline lexical vectors; set a semantic model for real deployments

[node]
id = "1d0e5a01-6c1b-4a7e-9f20-000000000003"
name = "node3"

[federation]
enabled = true
federation_id = "4d2c1b0a-0000-4000-8000-000000000001"
# Local demo only: the nodes call each other over the compose network in
# cleartext, at private addresses. For a real deployment use https://
# peer URLs (optionally with mTLS) and remove these two lines.
insecure_peer_hosts = ["memora-node1", "memora-node2"]
private_peer_hosts = ["memora-node1", "memora-node2"]

[[federation.peers]]
node_id = "1d0e5a01-6c1b-4a7e-9f20-000000000001"
name = "node1"
url = "http://memora-node1:7777"

[[federation.peers]]
node_id = "1d0e5a01-6c1b-4a7e-9f20-000000000002"
name = "node2"
url = "http://memora-node2:7777"
