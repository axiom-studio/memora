services:
  memora-node1:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "7771:7777"
    environment:
      MEMORA_CONFIG: /etc/memora/config.toml
      MEMORA_MCP_ENABLE: "true"
    volumes:
      - node1-data:/data
      - ./node1.toml:/etc/memora/config.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/memora-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  memora-node2:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "7772:7777"
    environment:
      MEMORA_CONFIG: /etc/memora/config.toml
      MEMORA_MCP_ENABLE: "true"
    volumes:
      - node2-data:/data
      - ./node2.toml:/etc/memora/config.toml:ro
