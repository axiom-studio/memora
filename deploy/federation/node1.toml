[server]
addr = ":7777"
mode = "single-tenant"
# api_key comes from MEMORA_API_KEY (set per node in docker-compose.yml).

[storage]
data_dir = "/data"
metadata_driver = "sqlite"
vector_driver = "sqlite-vec"
ledger_driver = "sqlite"
graph_driver = "sqlite_graph"
content_driver = "file"

[embedding]
model = "noop:default"

[federation]
enabled = true
federation_id = "fed_demo_cluster"

[[federation.peers]]
name = "node2"
url = "http://memora-node2:7777"

[[federation.peers]]
name = "node3"
url = "http://memora-node3:7777"
