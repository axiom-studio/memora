[server]
addr = ":7777"
mode = "single-tenant"
# api_key comes from MEMORA_API_KEY (set per node in docker-compose.yml).

[storage]
data_dir = "/data"
# DSNs come from MEMORA_{METADATA,VECTOR,LEDGER,CONTENT}_DSN, built in
# docker-compose.yml from POSTGRES_PASSWORD. Never commit credentials here.
metadata_driver = "postgres"
vector_driver = "pgvector"
ledger_driver = "postgres"
# No graph driver exists for postgres metadata yet; sqlite_graph needs the
# sqlite metadata tables, so the context graph is disabled on this topology.
graph_driver = "none"
content_driver = "postgres"

[embedding]
model = "hash:default"  # offline lexical vectors; set a semantic model for real deployments

[node]
id = "2f7b9c02-4d3e-4b8a-8e61-000000000002"
name = "node2"

[federation]
enabled = true
federation_id = "5e3d2c1b-0000-4000-8000-000000000002"
# Local demo only: the nodes call each other over the compose network in
# cleartext, at private addresses. For a real deployment use https://
# peer URLs (optionally with mTLS) and remove these two lines.
insecure_peer_hosts = ["memora-node1", "memora-node3"]
private_peer_hosts = ["memora-node1", "memora-node3"]

[[federation.peers]]
node_id = "2f7b9c02-4d3e-4b8a-8e61-000000000001"
name = "node1"
url = "http://memora-node1:7777"

[[federation.peers]]
node_id = "2f7b9c02-4d3e-4b8a-8e61-000000000003"
name = "node3"
url = "http://memora-node3:7777"
