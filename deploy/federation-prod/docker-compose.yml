# Secrets are required, never defaulted: copy .env.example to .env and fill it
# in (see README.md in this directory). Postgres is reachable only on the
# compose network as postgres:5432 and is not published on the host.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/federation-prod/.env (see README.md)}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  memora-node1:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "7771:7777"
    environment:
      MEMORA_CONFIG: /etc/memora/config.toml
      MEMORA_MCP_ENABLE: "true"
      MEMORA_API_KEY: "${MEMORA_NODE1_API_KEY:?set MEMORA_NODE1_API_KEY in deploy/federation-prod/.env}"
      MEMORA_METADATA_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node1?sslmode=disable"
      MEMORA_VECTOR_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node1?sslmode=disable"
      MEMORA_LEDGER_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node1?sslmode=disable"
      MEMORA_CONTENT_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node1?sslmode=disable"
    volumes:
      - node1-data:/data
      - ./node1.toml:/etc/memora/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/memora-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  memora-node2:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "7772:7777"
    environment:
      MEMORA_CONFIG: /etc/memora/config.toml
      MEMORA_MCP_ENABLE: "true"
      MEMORA_API_KEY: "${MEMORA_NODE2_API_KEY:?set MEMORA_NODE2_API_KEY in deploy/federation-prod/.env}"
      MEMORA_METADATA_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node2?sslmode=disable"
      MEMORA_VECTOR_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node2?sslmode=disable"
      MEMORA_LEDGER_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node2?sslmode=disable"
      MEMORA_CONTENT_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node2?sslmode=disable"
    volumes:
      - node2-data:/data
      - ./node2.toml:/etc/memora/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/memora-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  memora-node3:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "7773:7777"
    environment:
      MEMORA_CONFIG: /etc/memora/config.toml
      MEMORA_MCP_ENABLE: "true"
      MEMORA_API_KEY: "${MEMORA_NODE3_API_KEY:?set MEMORA_NODE3_API_KEY in deploy/federation-prod/.env}"
      MEMORA_METADATA_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node3?sslmode=disable"
      MEMORA_VECTOR_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node3?sslmode=disable"
      MEMORA_LEDGER_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node3?sslmode=disable"
      MEMORA_CONTENT_DSN: "postgres://memora:${POSTGRES_PASSWORD}@postgres:5432/memora_node3?sslmode=disable"
    volumes:
      - node3-data:/data
      - ./node3.toml:/etc/memora/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/memora-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pg-data:
  node1-data:
  node2-data:
  node3-data:
