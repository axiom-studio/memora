[server]
addr = ":7777"
mode = "single-tenant"
# api_key comes from MEMORA_API_KEY (set per node in docker-compose.yml).

[storage]
data_dir = "/data"
# DSNs come from MEMORA_{METADATA,VECTOR,LEDGER,CONTENT}_DSN, built in
# docker-compose.yml from POSTGRES_PASSWORD. Never commit credentials here.
metadata_driver = "postgres"
vector_driver = "pgvector"
ledger_driver = "postgres"
# No graph driver exists for postgres metadata yet; sqlite_graph needs the
# sqlite metadata tables, so the context graph is disabled on this topology.
graph_driver = "none"
content_driver = "postgres"

[embedding]
model = "noop:default"

[federation]
enabled = true
federation_id = "fed_prod_cluster"

[[federation.peers]]
name = "node1"
url = "http://memora-node1:7777"

[[federation.peers]]
name = "node2"
url = "http://memora-node2:7777"
