# Memora Core — golangci-lint v2 configuration.
# Tuned for OSS contributors: noisy linters off, security/correctness linters on.
# Every exclusion below states why; per-line suppressions must use
# `//nolint:<linter> // <reason>` (Issue #5980).
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - gosec          # security issues
    - govet          # standard vet
    - ineffassign    # unused assignments
    - staticcheck    # bug & style checks
    - unused         # unused code
    - misspell       # common typos
    - revive         # replacement for golint
    - bodyclose      # unclosed HTTP response bodies
    - nilerr         # `return nil` after non-nil error
    - copyloopvar    # loop-variable capture issues (Go 1.22+)
  settings:
    errcheck:
      exclude-functions:
        # Deferred rollback after a successful Commit returns ErrTxDone by
        # design; the real error is the one Commit or the failing statement
        # already returned.
        - (*database/sql.Tx).Rollback
        - (github.com/jackc/pgx/v5.Tx).Rollback
        # Deferred best-effort close of a WebSocket that is already ending.
        - (*nhooyr.io/websocket.Conn).CloseNow
    govet:
      enable-all: true
      disable:
        - fieldalignment # mostly noise; opt-in per package if needed
        - shadow         # flags idiomatic `if err := ...` re-declarations; too noisy to gate on
    gosec:
      excludes:
        - G104 # unhandled errors (covered by errcheck with better signal)
        - G304 # file path provided as taint input (false positives in CLI tools)
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: relaxed rules.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # websocket.Dial closes the handshake response body itself.
      - path: internal/mcp/websocket_test\.go
        linters:
          - bodyclose
      # The console renders HTML with fmt.Fprintf; every string argument goes
      # through template.HTMLEscapeString (audited for #5980/#5994), so the
      # G705 taint findings there are false positives. Script-context values
      # must use jsonEscapeString.
      - path: internal/ui/
        linters:
          - gosec
        text: G705
      # nhooyr.io/websocket is deprecated in favour of its drop-in
      # successor github.com/coder/websocket; the dependency swap is tracked
      # separately so it gets its own review.
      - linters:
          - staticcheck
        text: "SA1019: .*nhooyr.io/websocket"
      # Generated files.
      - path: \.pb\.go$
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/axiom-studio/memora

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
  sort-order:
    - file
