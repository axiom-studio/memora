# Dev stack: published on loopback only, and the API key is required, never
# defaulted. Copy .env.example to .env and set MEMORA_API_KEY (#6032).
services:
  memora:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      MEMORA_ADDR: ":7777"
      MEMORA_API_KEY: "${MEMORA_API_KEY:?set MEMORA_API_KEY in .env (see .env.example)}"
      MEMORA_DATA_DIR: /data
      MEMORA_METADATA_DRIVER: sqlite
      MEMORA_VECTOR_DRIVER: sqlite-vec
      MEMORA_LEDGER_DRIVER: sqlite
      MEMORA_GRAPH_DRIVER: sqlite_graph
      MEMORA_CONTENT_DRIVER: file
      MEMORA_MCP_ENABLE: "true"
      # Plain-HTTP console on localhost; behind HTTPS use "always" (#6033).
      MEMORA_UI_COOKIE_SECURE: auto
    volumes:
      - memora-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/memora-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  memora-data:
