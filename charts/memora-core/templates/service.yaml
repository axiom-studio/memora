apiVersion: v1
kind: Service
metadata:
  name: {{ include "memora-core.fullname" . }}
  labels:
    {{- include "memora-core.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "memora-core.selectorLabels" . | nindent 4 }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "memora-core.fullname" . }}-data
  labels:
    {{- include "memora-core.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
{{- end }}
{{- if .Values.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memora-core.fullname" . }}-secret
  labels:
    {{- include "memora-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  api_key: {{ .Values.apiKey | quote }}
{{- end }}
