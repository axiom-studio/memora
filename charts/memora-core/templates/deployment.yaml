{{- if and (not .Values.apiKey) (not .Values.allowNoAuth) }}
{{- fail "memora-core refuses to start without auth on a non-loopback bind: set apiKey, or set allowNoAuth=true to run unauthenticated" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memora-core.fullname" . }}
  labels:
    {{- include "memora-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "memora-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "memora-core.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memora-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - serve
            - --metadata-driver={{ .Values.metadata.driver }}
            - --vector-driver={{ .Values.vector.driver }}
            - --ledger-driver={{ .Values.ledger.driver }}
            - --embedding-model={{ .Values.embeddingModel }}
            - --data-dir=/data
            {{- if .Values.allowNoAuth }}
            - --allow-no-auth
            {{- end }}
          env:
            {{- if .Values.apiKey }}
            - name: MEMORA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "memora-core.fullname" . }}-secret
                  key: api_key
            {{- end }}
            # Behind a TLS-terminating Ingress the pod sees plain HTTP, so the
            # console cookie's Secure flag cannot follow the request (#6033).
            - name: MEMORA_UI_COOKIE_SECURE
              value: {{ include "memora-core.uiCookieSecure" . | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7777
              protocol: TCP
          # exec probes: memora-cli reads MEMORA_API_KEY from the container
          # env, so they authenticate without exposing the key in the spec.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/memora-cli", "health"]
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["/usr/local/bin/memora-cli", "ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "memora-core.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
